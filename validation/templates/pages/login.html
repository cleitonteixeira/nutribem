{% extends "pages/initial.html" %}
{% block title %}Login | {% endblock title %}
{% block content_app %}
{% load static %}
<div class="container-fluid">
    <div class="row">
        <div class="d-flex align-items-center justify-content-center" style="height: 100vh;">
            <div class="col-4 text-center form-container">
                <img src="{% static 'global/img/Logo.png' %}" alt="Logo" class="mb-4" style="max-width: 150px;">
                <form method="post">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <label for="{{ form.username.id_for_label }}" class="col-sm-2 col-form-label">{{ form.username.label }}</label>
                        <div class="col-sm-10">
                            {{ form.username }}
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="{{ form.password.id_for_label }}" class="col-sm-2 col-form-label">{{ form.password.label }}</label>
                        <div class="col-sm-10">
                            {{ form.password }}
                        </div>
                    </div>
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success mt-1">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<style>
    body{
        background: linear-gradient(to bottom, #f4f4f9, #e9ecef);
    }
</style>
{% endblock content_app %}
